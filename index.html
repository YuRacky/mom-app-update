    d.innerHTML = '檔案不完整，缺少：' + miss.join('、') + '<br>請先解壓縮完整的「遠端APP的主檔.zip」，<br>再把「遠端APP的更新檔.zip」解壓縮覆蓋到同一個資料夾。'; }
  if (miss.length) show();
});
